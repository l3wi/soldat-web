# Bound completed TCP accept backlog; Node's own listen backlog is still the other bound.
net.core.somaxconn = 1024
# Bound incomplete TCP handshakes without reserving an oversized SYN queue.
net.ipv4.tcp_max_syn_backlog = 2048
# Use SYN cookies when the SYN queue overflows; not a substitute for app admission limits.
net.ipv4.tcp_syncookies = 1
# Loose reverse-path validation rejects unroutable IPv4 sources without breaking asymmetric OVH routing.
net.ipv4.conf.all.rp_filter = 2
# Apply the same loose check to interfaces created after boot; IPv6 has no rp_filter equivalent.
net.ipv4.conf.default.rp_filter = 2
